-- Turn off resource usage and types when reloading the file.
:unset +s +t

-- Turn on multi-line input and remove the distracting verbosity.
:set +m -v0

-- Turn on all compiler warnings except for using partial functions and
-- incomplete pattern matching
:set -Wall -Wno-x-partial -Wno-incomplete-patterns
-- Turn off warning about types being defaulted in interactive
:seti -Wno-type-defaults

-- Turn on OverloadedStrings
:seti -XOverloadedStrings

-- Turn on output of types.
:set +t
