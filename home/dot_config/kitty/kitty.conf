# Font
font_family family="Cascadia Code NF" features="+calt +ss01"
font_size 12

# Background
window_logo_path ~/Pictures/Terminal/FP/feli_miku_6.png
window_logo_position right
window_logo_alpha 0.5
window_logo_scale 100

# Layout
enabled_layouts splits,*

# Terminal style
cursor_shape  beam
tab_bar_style powerline

# Report kitty as kitty since xterm-kitty is intentionally misleading
term kitty

map alt+shift+d launch --location=split
map alt+shift+minus launch --location=hsplit
map alt+shift+plus launch --location=vsplit

map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

map alt+shift+left move_window left
map alt+shift+right move_window right
map alt+shift+up move_window up
map alt+shift+down move_window down

# Theme
foreground #cccccc
background #1e1e1e

selection_foreground #000000
selection_background #ffffff

cursor            #808080
cursor_text_color #000000

color0 #000000
color8 #666666

color1 #cd3131
color9 #f14c4c

color2  #0dbc79
color10 #23d18b

color3  #e5e510
color11 #f5f543

color4  #2472c8
color12 #3b8eea

color5  #bc3fbc
color13 #d670d6

color6  #11a8cd
color14 #29b8db

color7  #e5e5e5
color15 #e5e5e5
