# Font
font_family family="Cascadia Code NF" features="+calt +ss01"
font_size 12

# Window style
remember_window_size no
initial_window_width  120c
initial_window_height 36c

hide_window_decorations yes

window_logo_position right
window_logo_alpha 0.1
window_logo_scale 100

# Hide mouse when typing
mouse_hide_wait -1

# Layout
enabled_layouts splits,tall,*

# Scrollback
scrollback_lines 9001
scrollback_pager_history_size 5

# Cursor style
cursor_trail 500
cursor_trail_start_threshold 10

# Tab bar style
tab_bar_style powerline

# Notify command task that takes more than 20 seconds
notify_on_cmd_finish invisible 20

# Report Kitty as kitty since xterm-kitty is intentionally misleading
term kitty

# Keybinds
# Clipboard
map --allow-fallback=shifted,ascii ctrl+insert copy_to_clipboard

map kitty_mod+a>w kitten change-window-logo.py
map kitty_mod+a>r kitten random-window-logo.py ~/Pictures/Terminal/FP

# Window
map --allow-fallback=shifted,ascii alt+f4 close_os_window

map kitty_mod+0 nth_window -1

# Panes
map alt+shift+d launch --location=split
map alt+shift+h launch --location=hsplit
map alt+shift+v launch --location=vsplit

# Focus
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Moving
map alt+left move_window left
map alt+right move_window right
map alt+up move_window up
map alt+down move_window down

# Resize
map alt+shift+left resize_window narrower
map alt+shift+right resize_window wider
map alt+shift+up resize_window taller
map alt+shift+down resize_window shorter

# Tabs
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
map ctrl+alt+0 goto_tab -1

# Other
map kitty_mod+p command_palette

map --allow-fallback=shifted,ascii ctrl+alt+p>f kitten hints --type path --program -
map --allow-fallback=shifted,ascii ctrl+alt+p>shift+f kitten hints --type path
map --allow-fallback=shifted,ascii ctrl+alt+p>c kitten choose-files
map --allow-fallback=shifted,ascii ctrl+alt+p>d kitten choose-files --mode=dir
map --allow-fallback=shifted,ascii ctrl+alt+p>l kitten hints --type line --program -
map --allow-fallback=shifted,ascii ctrl+alt+p>w kitten hints --type word --program -
map --allow-fallback=shifted,ascii ctrl+alt+p>h kitten hints --type hash --program -
map --allow-fallback=shifted,ascii ctrl+alt+p>n kitten hints --type linenum
map --allow-fallback=shifted,ascii ctrl+alt+p>y kitten hints --type hyperlink

map alt+enter toggle_fullscreen

map alt+, edit_config_file
map ctrl+alt+, debug_config

map ctrl+alt+` kitty_shell window

# Theme
include current-theme.conf
