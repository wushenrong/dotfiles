protocol file
mime text/*
action launch --type=os-window -- $EDITOR -- $FILE_PATH

protocol file
mime image/*,video/*
action launch --type=background mpv -- $FILE_PATH

protocol ssh
action launch --type=os-window ssh -- $URL
