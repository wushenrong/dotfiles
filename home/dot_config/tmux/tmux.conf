## Set better keybindings
# emacs key bindings in tmux command prompt are better than vi keys, and
# vi key bindings in copying mode are better than emacs keys
set -g status-keys emacs
set -g mode-keys vi

unbind C-b
set -g prefix `
bind ` send-prefix

unbind %
unbind '"'
bind h split-window -h
bind v split-window -v

bind R source-file "~/.config/tmux/tmux.conf" \; \
  display-message 'Configuration Reloaded!'

# Set history scroll back
set -g history-limit 9001

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Redraw the status bar more frequently
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
set -g aggressive-resize on

# Enable mouse support
set -g mouse

# Window renumbering
set -g renumber-windows on

# Enable terminal features on select terminals
set -as terminal-features ',ms-terminal*:RGB:sixel'
set -as terminal-features ',gnome*:RGB'

# Plugin settings
set -g @fzf-links-editor-open-cmd "$EDITOR '%file':%line"

# # Install plugins
set -g @plugin 'azorng/tmux-smooth-scroll'

# Statusbar
set -g @plugin 'uhs-robert/tmux-oasis'

# fzf support
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alberti42/tmux-fzf-links'

# Session Management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run "~/.local/share/tmux/plugins/tpm/tpm"
